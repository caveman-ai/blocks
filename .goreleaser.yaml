version: 2
project_name: caveman-blocks
builds:
  - main: ./cmd/caveman-blocks
    binary: caveman-blocks
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  use: github
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]
homebrew_casks:
  - name: caveman-blocks
    repository:
      owner: JuliusBrussee
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/JuliusBrussee/caveman-blocks
    description: Your agents write each script once, well, and reuse it.
    license: Apache-2.0
# macOS signing and notarization are required before a public release (docs/decisions/0007);
# add `notarize:` once an Apple Developer ID is available.
release:
  draft: false
