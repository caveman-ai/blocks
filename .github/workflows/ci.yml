name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        # verify --policy-ref origin/main needs main; a PR checkout fetches only the PR ref.
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make check-instructions
      - run: make lint
      - run: make test
      - run: make build
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: make blocks-test
      - run: make blocks-verify
      - run: go run ./cmd/caveman-blocks lint .blocks && go run ./cmd/caveman-blocks verify --check --all --policy-ref origin/main && go run ./cmd/caveman-blocks sync --check
      # opencode-host.txtar loads the plugin in this OpenCode release. Bump it on purpose.
      - run: npm install -g @opencode/cli@2.0.32
      - run: make e2e
      - run: make bench-hook
  # The Go tests and make targets assume unix paths and sh; on Windows the binary is built, vetted and
  # driven through hooks install, status and uninstall in Git Bash, the shell Claude Code runs hooks in.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./internal/hook/install ./internal/hook -run "TestMarker|TestProfile"
      - run: go test ./internal/repo -run TestBinaryName
      - run: go build -o bin/caveman-blocks.exe ./cmd/caveman-blocks
      - run: scripts/smoke-hooks.sh "$PWD/bin/caveman-blocks.exe"
        shell: bash
