name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight; pushes to main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The old single job ran every step in series per OS. The same steps now run as two parallel
  # parts per OS, so the slower part, not the sum, sets the wall clock. Every step still runs on
  # both Linux and macOS.
  unix:
    name: ${{ matrix.part }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux on Blacksmith; macOS stays on GitHub-hosted runners.
        os: [blacksmith-4vcpu-ubuntu-2404, macos-latest]
        part: [go, blocks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # verify --policy-ref origin/main needs main; a PR checkout fetches only the PR ref.
          fetch-depth: ${{ matrix.part == 'blocks' && '0' || '1' }}  # quoted: a bare 0 is falsy
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod, cache: false }
      # setup-go keeps one cache per go.sum, written by whichever job ends first, so the parts would
      # share a cache missing the other parts' builds. Each part keeps its own, refreshed every run.
      - id: go-env
        run: |
          echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.part }}-

      - if: matrix.part == 'go'
        run: make check-instructions lint test

      - if: matrix.part == 'blocks'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - if: matrix.part == 'blocks'
        run: make blocks-test
      - if: matrix.part == 'blocks'
        run: make blocks-verify
      - if: matrix.part == 'blocks'
        run: go run ./cmd/caveman-blocks lint .blocks && go run ./cmd/caveman-blocks verify --check --all --policy-ref origin/main && go run ./cmd/caveman-blocks sync --check

      # Both targets depend on `make build`, so the release-flag build is still checked here.
      # bench-hook times whole processes against a 5 ms budget; it runs after the Go suite as in the
      # old single job, since as its own job on a just-booted macOS runner it measured slower.
      - if: matrix.part == 'go'
        run: make e2e
      - if: matrix.part == 'go'
        run: make bench-hook

  # The Go tests and make targets assume unix paths and sh; on Windows the binary is built, vetted and
  # driven through hooks install, status and uninstall in Git Bash, the shell Claude Code runs hooks in.
  windows:
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./internal/hook/install ./internal/hook -run "TestMarker|TestProfile"
      - run: go test ./internal/repo -run TestBinaryName
      - run: go build -o bin/caveman-blocks.exe ./cmd/caveman-blocks
      - run: scripts/smoke-hooks.sh "$PWD/bin/caveman-blocks.exe"
        shell: bash

