# One table per harness (docs/INTEGRATION.md, layer 3). Facts from docs/research/harness-hooks-2026-10-03.md.
# `hooks install`, `hooks uninstall` and `hooks status` read this: config file, format, events, timeout.
# A path may start with ${VAR:-default}: the harness's own config-dir variable when set, else default.
# OpenCode has none: OPENCODE_CONFIG_DIR adds a directory, it does not move ~/.config/opencode.

[claude-code]
phase = 1
dialect = "claude"
detect = ["${CLAUDE_CONFIG_DIR:-~/.claude}"]
config = "${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json"
config_format = "claude-settings"
pre_event = { name = "PreToolUse", matcher = "Bash" }
post_event = {}
timeout = { value = 5, unit = "s" }
trust_note = "Hooks run after the folder is trusted in an interactive session."

[codex]
phase = 1
dialect = "claude"
detect = ["${CODEX_HOME:-~/.codex}"]
config = "${CODEX_HOME:-~/.codex}/hooks.json"
config_format = "codex-hooks"
pre_event = { name = "PreToolUse", matcher = "Bash" }
post_event = {}
timeout = { value = 5, unit = "s" }
trust_note = "Codex trusts each new or changed hook once: open /hooks in Codex and approve it."

[cursor]
phase = 1
dialect = "cursor"
detect = ["~/.cursor"]
config = "~/.cursor/hooks.json"
config_format = "cursor-hooks"
pre_event = { name = "beforeShellExecution" }
post_event = { name = "afterShellExecution" }
timeout = { value = 5, unit = "s" }
trust_note = "Cursor also loads Claude Code hook files by default; the hook dedupes the double call."

[opencode]
phase = 1
dialect = "generic"
detect = ["~/.config/opencode"]
config = "~/.config/opencode/plugins/caveman-blocks.js"
config_format = "opencode-plugin"
pre_event = { name = "tool.execute.before", matcher = "shell|bash" }
post_event = { name = "tool.execute.after", matcher = "shell|bash" }
timeout = { value = 5, unit = "s" }
trust_note = "OpenCode loads the plugin on its next start; the hint arrives appended to the tool output. The tool is `shell` on OpenCode 2.x and `bash` on 1.x."

[copilot]
phase = 2
dialect = "copilot"
detect = ["~/.copilot"]
config = "~/.copilot/hooks/blocks.json"
config_format = "copilot-hooks"
pre_event = { name = "preToolUse", matcher = "bash" }
post_event = { name = "postToolUse", matcher = "bash" }
timeout = { value = 5, unit = "s" }
trust_note = "A non-zero exit on preToolUse denies the command; the hook always exits 0."

[gemini]
phase = 2
dialect = "gemini"
detect = ["~/.gemini"]
config = "~/.gemini/settings.json"
config_format = "gemini-settings"
pre_event = { name = "BeforeTool", matcher = "run_shell_command" }
post_event = { name = "AfterTool", matcher = "run_shell_command" }
timeout = { value = 5000, unit = "ms" }
trust_note = "Gemini reads AGENTS.md only when configured; GEMINI.md gets the import line."
